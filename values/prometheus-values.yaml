grafana:
  enabled: true
  adminPassword: admin
  ingress:
    enabled: false
  
  # Enable sidecar for datasource provisioning from secrets
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource   # The label that the configmaps or secrets are marked with
      labelValue: "1"             # The label value to look for
      searchNamespace: "monitoring" # If specified, the sidecar will search for datasource config in this namespace
  
  # Add the plugin to the list of plugins to install
  plugins:
    - grafana-x-ray-datasource

prometheus:
  prometheusSpec:
    probeSelectorNilUsesHelmValues: false
    retention: 24h  # Adjust retention period as needed
    resources:
      requests:
        memory: "1Gi"
        cpu: "500m"
      limits:
        memory: "2Gi"
        cpu: "1000m"

alertmanager:
  enabled: true

prometheusOperator:
  tls:
    enabled: false
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# Reduce resource usage for development
kubeStateMetrics:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

nodeExporter:
  enabled: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    general: true
    k8s: true
    kubeApiserver: true
    kubePrometheusNodeAlerting: true
    kubePrometheusNodeRecording: true
    kubernetesAbsent: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeScheduler: true
    network: true
    node: true
    prometheus: true
    time: true 
